kind = "web"
previewPath = "/"
title = "Gaan Fun Khaan POS"
version = "1.0.0"
id = "artifacts/gaan-fun-khaan"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18634

[services.development]
run = "pnpm --filter @workspace/gaan-fun-khaan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gaan-fun-khaan", "run", "build" ]
publicDir = "artifacts/gaan-fun-khaan/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18634"
BASE_PATH = "/"
